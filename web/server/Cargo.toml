[package]
name = "hghub-web"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
description = "HGhub 网页版服务端：复用桌面端 Rust 核心（数据/解密/流转发）"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
  "gzip",
  "brotli",
  "json",
  "charset",
] }
time = { version = "0.3", features = ["formatting"] }
aes = "0.8"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
cookie = "0.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
